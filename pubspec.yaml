name: suinime_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  video_player: ^2.11.1
  http: ^1.6.0
  provider: ^6.1.2  # Untuk state management
  cached_network_image: ^3.4.0  # Untuk caching gambar
  intl: ^0.19.0  # Untuk format waktu
  flutter_screenutil: ^5.9.3  # Untuk responsive
  chewie: ^1.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/suinime_icon.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/suinime_icon.jpg
  adaptive_icon_background: "#0F0F0F"
  adaptive_icon_foreground: assets/icon/suinime_icon.jpg
  remove_alpha_ios: true
